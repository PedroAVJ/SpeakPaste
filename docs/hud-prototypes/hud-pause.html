<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpeakPaste — pause</title>
<style>
  body { margin: 0; padding: 40px; background: #1c1e22; color: #c8c8cc; font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; font-weight: 500; color: #e8e8ec; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: #8f8f96; margin: 0 0 26px; max-width: 620px; line-height: 1.6; }
  .scene { background: #2a2d33; border-radius: 14px; height: 170px; display: flex; align-items: center; justify-content: center; max-width: 620px; overflow: hidden; }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; color: #c8c8cc; background: #2a2d33; border: 1px solid #3d4048; border-radius: 8px; padding: 8px 15px; cursor: pointer; }
  button:hover { background: #363940; }
  .cta { font-size: 13px; color: #8f8f96; margin-top: 12px; max-width: 620px; line-height: 1.6; min-height: 20px; }
  @keyframes wob { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
  @keyframes dotp { 0%,100% { opacity: 0.4; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .cap { height: 36px; border-radius: 18px; background: rgba(248,248,250,0.92); box-shadow: 0 3px 10px rgba(0,0,0,0.35); position: relative; display: flex; align-items: center; justify-content: center; padding: 0 16px; transition: opacity 0.3s; }
  .cap.rest { opacity: 0.78; }
  .bars { display: flex; align-items: center; gap: 3px; height: 22px; transition: opacity 0.2s; }
  .bars span { width: 3.5px; border-radius: 2px; background: #e2483d; transition: background 0.35s; }
  .rest .bars span { animation-play-state: paused !important; background: #9a9aa2; }
  .front { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.7); transition: opacity 0.2s, transform 0.2s; }
  .front svg { width: 16px; height: 16px; stroke: #3f6f86; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #f0a03a; animation: dotp 0.95s ease-in-out infinite; margin-left: 7px; }
  .beat .front { opacity: 1; transform: scale(1); }
  .beat .bars { opacity: 0; }
</style>
</head>
<body>
<h1>Pause and resume</h1>
<p class="sub">Recording on the Mac. The same source key pauses; while resting, either source key resumes — the resting capsule is sourceless, so the key decides the next microphone.</p>

<div class="scene">
  <div class="cap" id="cap">
    <span class="front" id="front"></span>
    <div class="bars" id="bars"></div>
  </div>
</div>

<div class="controls">
  <button id="bMac">right ⌘</button>
  <button id="bPhone">right ⌥</button>
</div>
<div class="cta" id="cta"></div>

<script>
  var GL_MAC = '<svg viewBox="0 0 24 24"><path d="M4 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10H4z"/><path d="M2 19h20"/></svg>';
  var GL_PHONE = '<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>';

  var cap = document.getElementById('cap'), front = document.getElementById('front');
  var bars = document.getElementById('bars'), cta = document.getElementById('cta');
  [4,7,10,14,17,19,20,19,17,14,10,7,4].forEach(function(h, i) {
    var s = document.createElement('span');
    s.style.height = h + 'px';
    s.style.animation = 'wob ' + (0.5 + (i % 5) * 0.045).toFixed(3) + 's ease-in-out ' + ((i * 0.037) % 0.16).toFixed(3) + 's infinite';
    bars.appendChild(s);
  });

  var actx = null, cache = {};
  function ctx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function snd(id) {
    var c = ctx();
    if (cache[id]) { var s = c.createBufferSource(); s.buffer = cache[id]; s.connect(c.destination); s.start(); return; }
    fetch(document.getElementById(id).src).then(function(r) { return r.arrayBuffer(); })
      .then(function(ab) { return c.decodeAudioData(ab); })
      .then(function(b) { cache[id] = b; var s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(); })
      .catch(function() {});
  }
  function tone(freq, dur, vol) {
    var c = ctx(), at = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + dur + 0.06);
  }
  var holdTone = function() { tone(220, 0.15, 0.05); };
  var tickTone = function() { tone(329.63, 0.07, 0.045); };

  var state = 'hot', source = 'mac', timers = [];
  function stopT() { timers.forEach(clearTimeout); timers = []; }

  function live(msg) {
    cap.classList.remove('beat');
    cta.textContent = msg;
  }
  function resume(src) {
    stopT();
    state = 'hot';
    cap.classList.remove('rest');
    front.innerHTML = src === 'mac' ? GL_MAC : GL_PHONE + '<span class="dot"></span>';
    cap.classList.add('beat');
    source = src;
    if (src === 'mac') {
      snd('aLive');
      cta.textContent = 'resume on Mac — ping, short beat, bars';
      timers.push(setTimeout(function() { live('recording on Mac — same dictation, new segment'); }, 420));
    } else {
      tickTone();
      cta.textContent = 'resume on iPhone — tick; the dot breathes while Continuity wakes…';
      timers.push(setTimeout(function() { snd('aLive'); live('recording on iPhone — same dictation, new segment'); }, 2100));
    }
  }
  function press(src) {
    if (state === 'hot') {
      if (src === source) {
        stopT();
        state = 'rest';
        holdTone();
        cap.classList.remove('beat');
        cap.classList.add('rest');
        cta.textContent = 'resting — hold tone, frozen gray, sourceless; either key resumes';

        cta.textContent = 'inert — the other source key does nothing while a mic is live';
      }
      return;
    }
    resume(src);
  }
  document.getElementById('bMac').addEventListener('click', function() { press('mac'); });
  document.getElementById('bPhone').addEventListener('click', function() { press('phone'); });
  cta.textContent = 'recording on Mac — right ⌘ pauses; right ⌥ is inert';
