<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpeakPaste — the whole dictation, live</title>
<style>
  body { margin: 0; padding: 40px; background: #1c1e22; color: #c8c8cc; font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; font-weight: 500; color: #e8e8ec; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: #8f8f96; margin: 0 0 26px; max-width: 620px; line-height: 1.6; }
  .scene { background: #2a2d33; border-radius: 14px; height: 180px; display: flex; align-items: center; justify-content: center; max-width: 620px; overflow: hidden; }
  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; color: #c8c8cc; background: #2a2d33; border: 1px solid #3d4048; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button:hover { background: #363940; }
  .cta { font-size: 13px; color: #8f8f96; margin-top: 12px; max-width: 620px; line-height: 1.6; min-height: 40px; }
  @keyframes wob { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
  @keyframes dotp { 0%,100% { opacity: 0.4; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .cap { height: 36px; border-radius: 18px; background: rgba(248,248,250,0.92); box-shadow: 0 3px 10px rgba(0,0,0,0.35); position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 54px; opacity: 0; transform: scale(0.86);
         transition: width 0.35s cubic-bezier(0.3,1.2,0.5,1), opacity 0.3s cubic-bezier(0.34,1.4,0.64,1), transform 0.32s cubic-bezier(0.34,1.4,0.64,1); }
  .cap.on { opacity: 1; transform: scale(1); }
  .cap.dim { opacity: 0.78; }
  .cap.pop { transform: translateX(180px) !important; opacity: 0 !important; transition: transform 0.5s ease-in, opacity 0.45s ease-in !important; }
  .cap.fold { transform: scale(0.5, 0.16) !important; opacity: 0 !important; transition: transform 0.34s cubic-bezier(0.6,0,0.9,0.5), opacity 0.3s !important; }
  .front { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.7); transition: opacity 0.2s, transform 0.2s; }
  .cap.beat .front { opacity: 1; transform: scale(1); }
  .front svg { width: 16px; height: 16px; stroke: #3f6f86; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #f0a03a; animation: dotp 0.95s ease-in-out infinite; margin-left: 7px; }
  .bars { display: flex; align-items: center; gap: 3px; height: 22px; opacity: 0; transition: opacity 0.2s; }
  .cap.voiced .bars { opacity: 1; }
  .cap.beat .bars { opacity: 0; }
  .bars span { width: 3.5px; border-radius: 2px; background: #e2483d; transition: background 0.35s; }
  .cap.cold .bars span { animation-play-state: paused !important; background: #9a9aa2; }
  .caret { display: none; }
  .caret svg { width: 15px; height: 15px; stroke: #1f8f66; fill: none; stroke-width: 1.7; stroke-linecap: round; }
  .rail { display: none; width: 74px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.15); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 2px; background: #1f9d72; }
  .pend { display: none; position: relative; width: 22px; height: 22px; flex: 0 0 22px; }
  .pend svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .pend svg.ring circle { fill: none; stroke-width: 2; }
  .pend .track { stroke: rgba(0,0,0,0.13); }
  .pend .left { stroke: #c04a24; stroke-linecap: round; }
  .pend svg.xx { position: absolute; inset: 5px; width: 12px; height: 12px; stroke: #c04a24; fill: none; stroke-width: 2; stroke-linecap: round; }
</style>
</head>
<body>
<h1>The whole dictation</h1>
<p class="sub">All four keys, the full settled machine: start on either source, pause, resume on either source, end, cancel with its window, reopen from anywhere unsealed. The cancel face is the parked placeholder.</p>

<div class="scene">
  <div class="cap" id="cap">
    <span class="pend" id="pend">
      <svg class="ring" viewBox="0 0 22 22"><circle class="track" cx="11" cy="11" r="9"/><circle class="left" id="ringLeft" cx="11" cy="11" r="9"/></svg>
      <svg class="xx" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
    </span>
    <span class="caret" id="caret"><svg viewBox="0 0 24 24"><path d="M9 4h6M9 20h6M12 4v16"/></svg></span>
    <div class="rail" id="rail"><div class="fill" id="fill"></div></div>
    <div class="bars" id="bars"></div>
    <span class="front" id="front"></span>
  </div>
</div>

<div class="controls">
  <button id="kMac">right ⌘</button>
  <button id="kPhone">right ⌥</button>
  <button id="kFn">fn</button>
  <button id="kEsc">Esc</button>
</div>

  var C = 2 * Math.PI * 9;

  var cap = document.getElementById('cap'), front = document.getElementById('front');
  var bars = document.getElementById('bars'), rail = document.getElementById('rail'), fill = document.getElementById('fill');

  var cta = document.getElementById('cta');
  [4,7,10,14,17,19,20,19,17,14,10,7,4].forEach(function(h, i) {

    st = 'rest'; banked = true;

    if (st === 'rest') { begin(which, 'resume'); return; }
    if (st === 'deliver' || st === 'cancel') { begin(which, 'reopen'); return; }

      return;
    }
    if (st === 'hot' || st === 'rest' || st === 'deliver') { goCancel(); return; }
  });

  toIdle();
</script>
